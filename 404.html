<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Η σελίδα δεν βρέθηκε | INDICTA</title>
<style>
:root{--bg:#faf8f4;--text:#22201d;--muted:#6d665c;--accent:#7b2d26;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--bg);color:var(--text);text-align:center;padding:2rem;font-family:var(--serif);}
main{max-width:34rem}
.code{margin:0;font-size:clamp(4rem,16vw,8rem);line-height:1;font-weight:400;
color:var(--accent);letter-spacing:-.03em}
h1{margin:1.2rem 0 .6rem;font-size:clamp(1.15rem,3.4vw,1.5rem);font-weight:400}
p{margin:0 0 2.2rem;color:var(--muted);font-size:1rem;line-height:1.7}
a{display:inline-block;padding:.7rem 1.7rem;border:1px solid var(--accent);border-radius:999px;
color:var(--accent);text-decoration:none;font-size:1rem;
transition:background-color .2s ease,color .2s ease}
a:hover,a:focus-visible{background:var(--accent);color:var(--bg);outline:none}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>Η σελίδα δεν βρέθηκε</h1>
<p>Η διεύθυνση που ζητήσατε δεν υπάρχει ή έχει μετακινηθεί.</p>
<a href="/">Αρχική</a>
</main>
</body>
</html>
